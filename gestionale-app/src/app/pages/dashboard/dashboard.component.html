
<div class="dashboard-container">

  <section class="dashboard-intro">
    <h1>Le tue sezioni</h1>
    <p>
      Seleziona il modulo che desideri utilizzare.
    </p>
  </section>

  <section class="modules-grid">

    <p-card styleClass="module-card">

      <ng-template pTemplate="header">
        <div class="module-banner">
          <i class="pi pi-wallet"></i>
        </div>
      </ng-template>

      <h2>Finanze</h2>

      <p>
        Gestisci il tuo conto personale, le entrate,
        le uscite, i movimenti e i tuoi salvadanai.
      </p>

      <p-button
        label="Apri Finanze"
        icon="pi pi-arrow-right"
        iconPos="right"
        (onClick)="apriFinanze()">
      </p-button>

    </p-card>

    <p-card styleClass="module-card">

      <ng-template pTemplate="header">
        <div class="module-banner future-banner">
          <i class="pi pi-plus"></i>
        </div>
      </ng-template>

      <h2>Nuovi moduli</h2>

      <p>
        Qui potrai aggiungere altre funzionalità
        del tuo gestionale personale.
      </p>

      <span class="coming-soon">
        Prossimamente
      </span>

    </p-card>

  </section>

</div>
